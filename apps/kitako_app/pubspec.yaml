name: kitako_app
description: "KitaKo - Multimodal Image Retrieval Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.6.0

  # Image picking
  image_picker: ^1.2.1

  # Gallery access
  photo_manager: ^3.8.3

  # File paths
  path_provider: ^2.1.5

  # Sharing
  share_plus: ^10.1.4

  # ONNX Runtime inference
  onnxruntime: ^1.4.1

  # Local packages
  kitako_ann:
    path: ../../packages/kitako_ann
  kitako_core:
    path: ../../packages/kitako_core
  kitako_embedding:
    path: ../../packages/kitako_embedding
  kitako_ffi:
    path: ../../packages/kitako_ffi
  kitako_normalizer:
    path: ../../packages/kitako_normalizer

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/tokenizer/
    - assets/model/image_encoder/
    - assets/model/text_encoder/
    - assets/model/merged_epoch8_step6024/
    - assets/models/tokenizer/
